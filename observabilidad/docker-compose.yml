services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: codeforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: codeforge-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
